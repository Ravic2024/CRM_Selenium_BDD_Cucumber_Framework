extent.reporter.spark.class=com.aventstack.extentreports.reporter.ExtentSparkReporter
extent.reporter.json.class=com.aventstack.extentreports.reporter.JsonFormatter
extent.reporter.pdf.class=tech.grasshopper.pdf.extent.ExtentPDFCucumberReporter

extent.reporter.spark.start=true
extent.reporter.json.start=true
#extent.reporter.html.start=true
extent.reporter.pdf.start=true
#extent.reporter.excel.start=false


extent.reporter.spark.out=ExtentSpark.html
extent.reporter.json.out=ExtentJson.json
#extent.reporter.html.out=ExtentHtml.html
extent.reporter.pdf.out=test-output/PdfReport/ExtentPdf.pdf
#extent.reporter.excel.out=test-output/Excel/ExtentExcel.xlsx

#Adding folder name and non repeating pattern
basefolder.name=src/test/resources/report/SparkReport
basefolder.datetimepattern=d-MMM-YY HH-mm-ss
basefolder.delimiter=_

extent.reporter.spark.config=src/main/resources/extent-config.xml
extent.reporter.logger.config=src/main/resources/extent-config.xml



extent.reporter.spark.vieworder=dashboard,test,category,exception,author,device,log
extent.reporter.office.vieworder=alphabetical
extent.reporter.office.documentName=TestReport.docx


systeminfo.OS=Windows
systeminfo.Owner=NBE
systeminfo.Role=NBE Automation Testing Team
systeminfo.Environment=UAT